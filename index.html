<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounting Hub · Acacia</title>
<meta name="theme-color" content="#10213B">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --green:#22A749;--green7:#1A713E;--green05:#EDF8F0;
  --blue:#1B4DA0;--blue7:#15366B;--blue05:#EDF1F7;--blue1:#D6DFEE;--blue3:#A8BBDB;--sky:#EAF0FA;
  --mid:#12294E;--ink:#10213B;--carbon:#2C2C2C;--muted:#616161;--mist:#F5F5F5;--silver:#DDDDDD;
  --grad:linear-gradient(135deg,#22A749 0%,#1E7A74 50%,#1B4DA0 100%);
  --depth:linear-gradient(160deg,#12294E 0%,#10213B 100%);
  --display:"Montserrat","Avenir Next","Segoe UI",Arial,sans-serif;
  --body:"Open Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --shadow:0 12px 32px rgba(27,77,160,.12);--lift:0 20px 48px rgba(27,77,160,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.55 var(--body);color:var(--carbon);background:#fff;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mt{margin:32px 0 12px;font-size:17px}
.btn{border:0;border-radius:8px;padding:11px 20px;font:700 14px/1.2 var(--display);cursor:pointer;background:var(--blue);color:#fff;transition:background .2s,transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--blue7);transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,77,160,.18)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.ghost:hover{background:var(--blue05)}
.btn.dark{background:var(--ink)}
.btn.dark:hover{background:var(--mid)}
.btn.link{background:none;color:var(--blue);padding:4px 8px;box-shadow:none}
.btn.link:hover{background:var(--blue05);transform:none;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.link.sm{padding:4px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.span2{grid-column:span 2}.full{grid-column:1/-1}
.field label{font:600 12.5px var(--display);color:var(--ink)}
input,select,textarea{height:42px;border:1px solid var(--silver);border-radius:8px;padding:0 12px;background:#fff;width:100%;transition:border-color .2s}
textarea{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue05)}
input:disabled,input[readonly]{background:var(--mist);color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);padding:0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.form-err{color:var(--ink);font-size:13.5px;font-weight:600;margin:0 auto 0 0;min-height:1em}
.form-err:not(:empty){background:var(--sky);box-shadow:inset 4px 0 0 var(--blue);padding:10px 14px 10px 18px;border-radius:8px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:32px 16px 20px}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:linear-gradient(180deg,#22A749 0%,#1E7A74 50%,#1B4DA0 100%)}
.brand{padding:0 12px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.wordmark{font:800 20px/1 var(--display);letter-spacing:.16em}
.brand-sub{font:600 12px var(--display);letter-spacing:.04em;opacity:.6}
img.logo{display:block;width:auto;height:auto;object-fit:contain}
img.side-logo{max-width:172px;max-height:76px}
img.dv-logo{max-width:200px;max-height:60px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.nav-label{font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);padding:0 12px 6px}
.ver{opacity:.45}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;font:600 14px var(--display);transition:background .2s,color .2s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 3px 0 0 var(--green)}
.side-foot{margin-top:auto;padding:20px 12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.yr{display:flex;flex-direction:column;gap:6px;padding:0 12px 24px;font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.yr select{height:38px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);font:700 15px var(--display);letter-spacing:0;text-transform:none}
.yr select option{color:var(--ink)}
.side-foot .who{font:700 13.5px var(--display);color:#fff}
.side-foot .role{opacity:.6;margin-bottom:6px}
.side-foot .lnk{background:none;border:0;padding:2px 0;color:rgba(255,255,255,.75);font:600 12.5px var(--display);text-align:left;cursor:pointer}
.side-foot .lnk:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.main{padding:48px 56px 128px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.eyebrow{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--green7);margin-bottom:10px}
.page-head h1{font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.head-acts{display:flex;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{max-width:320px}
.toolbar select,.toolbar input[type=month],.toolbar input[type=date]{width:auto;min-width:160px}
.toolbar .grow{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--silver);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--blue);color:#fff;text-align:left;font:700 12.5px var(--display);padding:12px 16px;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--silver);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--mist)}
tfoot td{font-weight:700;background:var(--blue05);border-top:2px solid var(--blue1)}
tr.void td{color:var(--muted)}
tr.void td .amt{text-decoration:line-through}
td .acts{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}
td.cr{padding-left:40px}
table.compact td{padding:8px 10px;vertical-align:middle}
table.compact th{padding:10px}
table.compact input,table.compact select{height:38px;padding:0 10px;font-size:14px}
.empty{border:1.5px dashed var(--silver);border-radius:12px;padding:48px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 17px var(--display);color:var(--ink);margin-bottom:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font:700 11.5px/1.4 var(--display);white-space:nowrap}
.p-outstanding{background:var(--blue05);color:var(--blue7)}
.p-cleared{background:var(--green05);color:var(--green7)}
.p-void{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px var(--silver)}
.p-pending{background:var(--blue05);color:var(--blue7)}
.p-partly-paid{background:var(--sky);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue3)}
.p-paid{background:var(--green05);color:var(--green7)}
.card{border:1px solid var(--silver);border-radius:16px;padding:28px 32px;margin-bottom:24px}
.card h2{font-size:18px;margin-bottom:16px}
tr.jfirst td{border-top:2px solid var(--blue1)}
tbody tr.jrow td{background:#fff}
tbody tr.jrow.alt td{background:var(--mist)}
.tag{display:inline-block;font:600 11.5px var(--display);color:var(--muted);background:var(--mist);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
/* voucher form */
.vform .section{margin-bottom:32px}
.vform h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 14px}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 24px;max-width:420px;margin-left:auto;font-size:14px}
.totals .t{font-weight:700;color:var(--ink)}
.checkamt{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 24px;border-radius:12px;background:var(--depth);color:#fff;margin-top:16px}
.checkamt .label{font:700 11.5px var(--display);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.checkamt .big{font:800 30px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.entry{border-radius:12px;background:var(--sky);box-shadow:inset 4px 0 0 var(--blue);padding:20px 24px}
.entry table{background:#fff;border-radius:8px;overflow:hidden}
.balcheck{margin:12px 0 0;font:600 13px var(--display)}
.balcheck.ok{color:var(--green7)}
.balcheck.bad{color:var(--ink)}
.warnline{font-size:13px;color:var(--ink);font-weight:600;margin-top:6px}
.warnline:empty{display:none}
.autolink{font:600 12px var(--display);color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lockline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-radius:12px;background:var(--sky);box-shadow:inset 4px 0 0 var(--blue);margin-bottom:24px;font-size:14px}
.banner{background:var(--ink);color:#fff;padding:12px 24px;font:600 14px var(--display);text-align:center}
.banner:empty{display:none}
/* sign-in and status screens */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--depth);position:relative}
.gate::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad)}
.gate-card{background:#fff;border-radius:16px;box-shadow:var(--lift);width:100%;max-width:420px;padding:40px 36px 32px;animation:rise .4s cubic-bezier(.4,0,.2,1)}
.gate-card.wide{max-width:640px}
.gate-logo{display:flex;justify-content:center;margin-bottom:20px}
.gate-logo img{max-width:200px;max-height:140px}
.gate-logo .wordmark{color:var(--blue);font-size:26px}
.gate-eyebrow{text-align:center;font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--green7);margin-bottom:24px}
.gate-card h1{font-size:24px;font-weight:800;margin-bottom:10px}
.gate-card .lead{margin:0 0 20px;color:var(--carbon)}
.gate-card .field{margin-bottom:16px}
.gate-card .btn{width:100%}
.gate-card .btn + .btn{margin-top:10px}
.gate-foot{text-align:center;margin-top:24px;font:700 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gate-err{margin:0 0 16px}
.gate-err:empty{display:none}
.errlist{max-height:46vh;overflow-y:auto;margin:0 0 20px;padding:12px 16px 12px 32px;border-radius:12px;background:var(--mist);font-size:13.5px}
.errlist li{margin-bottom:6px}
#busy{position:fixed;top:16px;right:16px;z-index:70;background:var(--ink);color:#fff;font:700 12.5px var(--display);padding:9px 16px;border-radius:999px;box-shadow:var(--lift);display:none;align-items:center;gap:10px}
#busy.on{display:flex}
#busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.busy #app{pointer-events:none}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,33,59,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;animation:fade .2s ease}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;box-shadow:var(--lift);animation:rise .25s cubic-bezier(.4,0,.2,1)}
.modal.wide{max-width:1040px}
.modal.mid{max-width:820px}
.modal-head{padding:28px 32px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}
.modal-head h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.modal-body{padding:24px 32px}
.modal-body .lead{margin:0 0 16px}
.modal-foot{padding:0 32px 28px;display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,24px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 4px 0 0 var(--blue),var(--lift)}
/* printed voucher */
.dv{position:relative;font-size:13px;color:var(--carbon);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:16px;margin-bottom:22px;border-bottom:5px solid transparent;border-image:var(--grad) 1}
.dv-word{font:800 26px/1 var(--display);letter-spacing:.16em;color:var(--blue)}
.dv-co{font-size:12px;color:var(--muted);margin-top:6px}
.dv-id{text-align:right}
.dv-title{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dv-no{font:800 26px/1.2 var(--display);color:var(--ink)}
.dv-grid{display:grid;grid-template-columns:110px 1fr 110px 150px;gap:8px 16px;margin-bottom:18px;align-items:baseline}
.dv-grid dt{font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dv-grid dd{margin:0;padding-bottom:6px;border-bottom:1px solid var(--silver);font-size:13.5px;min-height:1.4em}
.dv-grid dd.payee{font:700 16px var(--display);color:var(--ink)}
.dv-amt{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;margin:8px 0 22px;align-items:baseline}
.dv-amt dt{font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dv-amt dd{margin:0}
.dv-amt .big{font:800 28px/1.1 var(--display);color:var(--ink)}
.dv-amt .words{font-style:italic}
.dv-sect{font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.dv table{font-size:12.5px}
.dv th{padding:8px 10px;font-size:11.5px}
.dv td{padding:7px 10px;background:#fff!important}
.dv tfoot td{background:var(--blue05)!important;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.dv-sign{display:grid;grid-template-columns:110px 1fr 60px 150px;gap:22px 16px;margin:30px 0 0;align-items:end}
.dv-sign .lbl{font-size:11.5px;color:var(--muted)}
.dv-sign .line{border-bottom:1px solid var(--carbon);min-height:30px;display:flex;align-items:flex-end;justify-content:center;font-size:11.5px;padding-bottom:3px}
.dv-recv{margin-top:30px}
.dv-recv p{font-style:italic;margin:0 0 30px}
.dv-recv .row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
.dv-recv .row div{border-top:1px solid var(--carbon);padding-top:4px;font-size:11px;color:var(--muted)}
.dv-foot{display:flex;justify-content:space-between;margin-top:30px;padding-top:8px;border-top:3px solid transparent;border-image:var(--grad) 1;font-size:10.5px;color:var(--muted)}
.dv-foot b{color:var(--green7);letter-spacing:.06em}
.dv-stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font:800 72px var(--display);letter-spacing:.08em;color:rgba(16,33,59,.12);pointer-events:none;text-transform:uppercase}
.preview-wrap{border:1px solid var(--silver);border-radius:12px;padding:32px 40px;background:#fff;box-shadow:var(--shadow)}
#print-area{display:none}
@media print{
  @page{size:letter;margin:.55in}
  html,body{background:#fff}
  #modal-root,#toast,.banner{display:none!important}
  body.pv #app{display:none!important}
  body.pv #print-area{display:block!important}
  #print-area *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dv-page{page-break-after:always}
  .dv-page:last-child{page-break-after:auto}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:16px}
  .side::after{top:auto;left:0;width:auto;height:4px;background:var(--grad)}
  .brand{padding:0 8px;flex-direction:row;align-items:center}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .nav a{white-space:nowrap}
  .nav-group{flex-direction:row;margin:0}
  .nav-label,  .side-foot{display:none}
  .yr{padding:0 8px;flex-direction:row;align-items:center}
  .main{padding:32px 20px 96px}
  .fields{grid-template-columns:1fr 1fr}
  .modal-head,.modal-body{padding-left:20px;padding-right:20px}
  .modal-foot{padding:0 20px 24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="banner" id="banner" role="alert"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   ACCOUNTING HUB · Acacia Home Builders Corporation
   The screens live here (GitHub Pages). The books live in a Google Sheet,
   reached only through its Apps Script web app (Code.gs), which signs people
   in, checks every rule again and writes the rows.

   Structure: the hub is organised into groups (Payables, Receivables,
   Imports, Inventory, Books, Lists, Settings). Each transaction module
   (bills and check vouchers today; invoices, collections later) stores its
   own records and saves a balanced journal entry with each record. The
   Books pages read every module's entries through SOURCES, so new modules
   appear in the Journal and Monthly Summary without changes there.

   Every save works the same way: the change is made on a copy of the books,
   the rows it changes are worked out tab by tab (TABLES), and those rows go to
   Apps Script with the rows as they were loaded. Apps Script refuses the save
   if anyone changed the same rows since, or if any rule fails.
   ============================================================ */
/* The Apps Script web app this hub talks to. After deploying Code.gs, paste its URL here. */
const CFG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbyfK7WnQzZWJ7i8o1nf4rfuizX_l4AcSgEMwXetJzQMgwt-Mq8xWqmAkWd60FNAEzfX/exec'
};
const APP_NAME = 'Accounting Hub';
const APP_VERSION = '2.1';
/* Shown in the sidebar so anyone can confirm which build they're running. Change with every release. */
const HUB_BUILD = '2026-10-08';
/* The oldest Code.gs this hub works with. */
const API_NEEDED = 2;
const IDLE_MS = 3 * 60 * 60 * 1000;
const SESSION_KEY = 'accounting-hub-session';
const COMPANY = 'Acacia Home Builders Corporation';
const VAT_RATE = 0.12;
/* Payables accounts bills post to: trade for suppliers of goods we resell, others for service providers. */
const CONTROL_DEFAULT = { apTrade: 'Accounts Payable - Trade', apOther: 'Accounts Payable - Others', retained: 'Retained Earnings' };
/* What a role can be allowed to change, by page. Code.gs checks the same keys on every save.
   Everyone signed in can see every page; these decide what they can change. */
const PERMISSIONS = [
  ['Supplier Bills', [['bills.edit', 'Enter and edit'], ['bills.void', 'Void']]],
  ['Check Vouchers', [['vouchers.edit', 'Enter and edit'], ['vouchers.void', 'Void']]],
  ['Check Monitoring', [['checks.clear', 'Mark cleared']]],
  ['Contacts', [['contacts.edit', 'Add, edit and delete']]],
  ['Monthly Summary', [['months.lock', 'Lock and unlock months'], ['year.close', 'Close the year']]],
  ['Chart of Accounts', [['accounts.add', 'Add accounts']]],
  ['Company and Printing', [['company.edit', 'Edit']]],
  ['Users and Roles', [['users.manage', 'Manage users and roles']]]
];
const PERM_LABEL = Object.fromEntries(PERMISSIONS.flatMap(([m, ps]) => ps.map(([k, l]) => [k, `${m}: ${l}`])));
const LOGO = {
  light: { files: ['logo.png'], src: null },
  dark: { files: [], src: null } // the sidebar uses the wordmark until there's a white logo
};
const ATC = [
  { code: 'WC100', rate: 0.05, label: 'Rent, corporate lessor' },

/* What's been paid on a bill: the live vouchers that pay it, optionally leaving one voucher out or stopping at a date. */
/* paidBefore: paid on a bill in earlier years' books (carried in, or still open in an earlier year). */
const billPaid = (id, exceptVoucher, asOf) => round2(((billOf(id) || {}).paidBefore || 0) + sum(D.vouchers.filter(v => live(v) && v.id !== exceptVoucher && (!asOf || v.date <= asOf)).flatMap(v => (v.bills || []).filter(p => p.billId === id).map(p => p.amount))));
const billBalance = (b, exceptVoucher, asOf) => round2(b.payable - billPaid(b.id, exceptVoucher, asOf));
const bStatus = b => { if (b.status === 'void') return 'Void'; const p = billPaid(b.id); return p <= 0 ? 'Pending' : p >= b.payable ? 'Paid' : 'Partly paid'; };
/* A document of this year's own, not one carried in or open from an earlier year. */
const own = x => !x.from;
const billPayers = id => D.vouchers.filter(v => live(v) && (v.bills || []).some(p => p.billId === id));
/* Suppliers of goods post to trade payables; everyone else to other payables. */
const apFor = roles => roles.includes('supplier') ? D.control.apTrade : D.control.apOther;
/* Month lock: entries dated on or before lockedThrough can't be added, edited or voided. */
const isLocked = date => !!(D.lockedThrough && date && date <= D.lockedThrough);
const lockedMsg = () => `Books are locked through ${fdate(D.lockedThrough)}. Use a date after that.`;
const vStatus = v => v.status === 'void' ? 'Void' : v.clearedOn ? 'Cleared' : 'Outstanding';
const controlIds = () => [D.control.bank, D.control.inputVat, D.control.ewt, D.control.apTrade, D.control.apOther];
const postableAccounts = () => D.accounts.filter(a => a.active && !controlIds().includes(a.id));
const sortAccounts = list => list.slice().sort((a, b) => typeRank(a.type) - typeRank(b.type) || a.type.localeCompare(b.type) || a.name.localeCompare(b.name));

/* ---------- Check voucher math and journal entry ----------
   Type what the invoice says. Everything else follows:
   VAT = 12/112 of the gross when VAT-inclusive, EWT = rate × amount net of VAT,
   check = gross − EWT. The entry always balances: net + VAT = EWT + check. */
/* The part bills and vouchers share: account lines, VAT and withholding. */
function taxCalc(v, ctl) {
  const lines = (v.lines || []).filter(l => l.accountId && Number(l.amount) > 0);
  const gross = sum(lines.map(l => l.amount));
  const vat = !v.vatable || !gross ? 0 : (v.vatManual && v.vat !== '' && v.vat != null ? round2(v.vat) : round2(gross * VAT_RATE / (1 + VAT_RATE)));
  const base = round2(gross - vat);
  const rate = v.atc ? (atcOf(v.atc) || { rate: 0 }).rate : 0;
  const ewtAuto = round2(base * rate);
  const ewt = !v.atc || !gross ? 0 : (v.ewtManual && v.ewt !== '' && v.ewt != null ? round2(v.ewt) : ewtAuto);
  let left = base;
  const nets = lines.map((l, i) => { if (i === lines.length - 1) return round2(left); const n = round2(Number(l.amount) - (gross ? vat * Number(l.amount) / gross : 0)); left = round2(left - n); return n; });
  const taxLines = [
    ...lines.map((l, i) => ({ acct: l.accountId, memo: l.desc || '', dr: nets[i], cr: 0 })),
    ...(vat ? [{ acct: ctl.inputVat, memo: '', dr: vat, cr: 0 }] : []),
    ...(ewt ? [{ acct: ctl.ewt, memo: `${v.atc} ${Math.round(rate * 100)}%`, dr: 0, cr: ewt }] : [])
  ];
  return { gross, vat, base, rate, ewt, ewtAuto, nets, lines, taxLines };
}
const totals = (t, entry) => ({ ...t, entry, dr: sum(entry.map(e => e.dr)), cr: sum(entry.map(e => e.cr)) });
/* Check voucher: bills it pays come off what's owed; items without a bill book as before.
   check = bills paid + items' gross − withholding on the items. */
function calc(v, ctl = D.control, findBill = billOf) {
  const t = taxCalc(v, ctl);
  const pays = (v.bills || []).map(p => { const b = findBill(p.billId) || {}; return { billId: p.billId, amount: round2(numIn(p.amount)), acct: p.acct || b.apAccount || '', ref: b.ref || '' }; }).filter(p => p.amount > 0);
  const billsPaid = sum(pays.map(p => p.amount));
  const check = round2(t.gross - t.ewt + billsPaid);
  const entry = [
    ...pays.map(p => ({ acct: p.acct, memo: p.ref ? `Invoice ${p.ref}` : '', dr: p.amount, cr: 0 })),
    ...t.taxLines,
    { acct: ctl.bank, memo: v.checkNo ? `Check ${v.checkNo}` : 'Check', dr: 0, cr: check }
  ];
  return totals({ ...t, pays, billsPaid, check }, entry);
}
/* Supplier bill: the expense, VAT and withholding are booked when the bill arrives; the rest is owed.
   payable = gross − withholding. */
function calcBill(b, ctl = D.control) {
  const t = taxCalc(b, ctl);
  const payable = round2(t.gross - t.ewt);
  return totals({ ...t, payable, check: payable }, [...t.taxLines, { acct: b.apAccount, memo: '', dr: 0, cr: payable }]);
}
const vGross = v => sum((v.lines || []).map(l => l.amount));

/* ---------- Journal sources ----------
   Every module that posts adds itself here. Each document: { src, id, ref, date, contact, memo, lines:[{acct,memo,dr,cr}] }. */
const SOURCES = {
  ob: {
    label: 'Opening balance',
    docs: () => D.opening && D.opening.lines.length ? [{ src: 'ob', id: 'OB', ref: 'Opening balance', date: D.opening.date, contact: '', memo: `Balances as of ${fdate(D.opening.date)}`, lines: D.opening.lines }] : []
  },
  bill: {
    label: 'Supplier bill',
    docs: () => D.bills.filter(b => live(b) && own(b)).map(b => ({ src: 'bill', id: b.id, ref: b.ref, date: b.date, contact: b.payeeName, memo: b.particulars, lines: b.entry || [] }))
  },
  cv: {
    label: 'Check voucher',
    docs: () => D.vouchers.filter(v => live(v) && own(v)).map(v => ({ src: 'cv', id: v.id, ref: v.cv, date: v.date, contact: v.payeeName, memo: v.particulars, lines: v.entry || [] }))
  }
};
const journal = (ym, src) => Object.entries(SOURCES).filter(([k]) => !src || k === src).flatMap(([, s]) => s.docs())
  .filter(d => !ym || d.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date) || a.ref.localeCompare(b.ref));

/* ---------- Financial reports: calculations only, no screen yet ----------
   Read every journal entry (opening balances included) and group accounts by STATEMENT.
   Amounts are shown with their normal sign: revenue and liabilities positive as credits. */
const STMT_SECTIONS = { 'Income statement': ['Revenue', 'Cost of sales', 'Operating expenses', 'Other income', 'Other expenses'], 'Balance sheet': ['Current assets', 'Noncurrent assets', 'Current liabilities', 'Noncurrent liabilities', 'Equity'] };
function balances(from, to) {
  const b = {};
  journal().filter(d => (!from || d.date >= from) && (!to || d.date <= to)).forEach(d => d.lines.forEach(l => { b[l.acct] = round2((b[l.acct] || 0) + (l.dr || 0) - (l.cr || 0)); }));
  return b;
}
function statementSections(b, statement) {
  const out = {};
  STMT_SECTIONS[statement].forEach(sec => { out[sec] = []; });
  sortAccounts(D.accounts).forEach(a => { const [st, sec, sign] = stmtOf(a.type); if (st === statement && b[a.id]) out[sec].push({ id: a.id, name: a.name, amount: round2(b[a.id] * sign) }); });
  return out;
}
const sectionTotal = rows => sum(rows.map(r => r.amount));
function incomeStatement(from, to) {
  const s = statementSections(balances(from, to), 'Income statement'), t = {};
  STMT_SECTIONS['Income statement'].forEach(sec => { t[sec] = sectionTotal(s[sec]); });
  const grossProfit = round2(t.Revenue - t['Cost of sales']), operatingIncome = round2(grossProfit - t['Operating expenses']);
  return { from, to, sections: s, totals: { ...t, grossProfit, operatingIncome, netIncome: round2(operatingIncome + t['Other income'] - t['Other expenses']) } };
}
function balanceSheet(asOf) {
  const b = balances('', asOf), s = statementSections(b, 'Balance sheet'), t = {};
  STMT_SECTIONS['Balance sheet'].forEach(sec => { t[sec] = sectionTotal(s[sec]); });
  // income and expenses not yet closed to retained earnings belong to equity
  const earnings = round2(-sum(D.accounts.filter(a => stmtOf(a.type)[0] === 'Income statement').map(a => b[a.id] || 0)));
  const assets = round2(t['Current assets'] + t['Noncurrent assets']), liabilities = round2(t['Current liabilities'] + t['Noncurrent liabilities']), equity = round2(t.Equity + earnings);
  return { asOf, sections: s, totals: { ...t, assets, liabilities, earnings, equity, balanced: round2(assets - liabilities - equity) === 0 } };
}

/* ---------- More reports: calculations only, no screen yet ---------- */
// Trial balance: every account with a balance on a date, debits and credits side by side.
function trialBalance(asOf) {
  const b = balances('', asOf);
  const rows = sortAccounts(D.accounts).filter(a => b[a.id]).map(a => ({ id: a.id, name: a.name, type: a.type, debit: b[a.id] > 0 ? b[a.id] : 0, credit: b[a.id] < 0 ? round2(-b[a.id]) : 0 }));
  const debit = sum(rows.map(r => r.debit)), credit = sum(rows.map(r => r.credit));
  return { asOf, rows, totals: { debit, credit, balanced: debit === credit } };
}
// Bank reconciliation: the bank statement's ending balance, less checks not yet cleared on that date,
// should equal the hub's bank balance. Deposits in transit join here once collections exist.
function bankReconciliation(asOf, statementBalance) {
  const book = round2(balances('', asOf)[D.control.bank] || 0);
  const outstanding = D.vouchers.filter(v => live(v) && v.checkDate <= asOf && (!v.clearedOn || v.clearedOn > asOf))
    .sort((a, b) => a.checkDate.localeCompare(b.checkDate)).map(v => ({ id: v.id, cv: v.cv, checkNo: v.checkNo, checkDate: v.checkDate, payee: v.payeeName, amount: v.checkAmount }));
  const outstandingTotal = sum(outstanding.map(o => o.amount));
  const adjustedBank = round2(Number(statementBalance) - outstandingTotal);
  return { asOf, bankAccount: acctName(D.control.bank), statementBalance: round2(Number(statementBalance)), outstanding, outstandingTotal, depositsInTransit: [], adjustedBank, bookBalance: book, difference: round2(adjustedBank - book) };
}
// Tax summary for a period: VAT payable (output less input) and withholding to remit, by ATC and by payee
// (the payee list is what the 2307 certificates and the quarterly withholding report need).
const outputVatAccount = () => D.accounts.find(a => a.name === 'Output VAT');
function taxSummary(from, to) {
  const b = balances(from, to), ov = outputVatAccount();
  const outputVat = ov ? round2(-(b[ov.id] || 0)) : 0, inputVat = round2(b[D.control.inputVat] || 0);
  const vs = [...D.bills, ...D.vouchers].filter(v => live(v) && own(v) && v.atc && v.date >= from && v.date <= to);
  const group = key => { const g = {}; vs.forEach(v => { const k = key(v); const x = g[k] || (g[k] = { base: 0, ewt: 0, count: 0 }); x.base = round2(x.base + round2(vGross(v) - v.vat)); x.ewt = round2(x.ewt + v.ewt); x.count++; }); return g; };
  const byAtc = Object.entries(group(v => v.atc)).map(([atc, x]) => ({ atc, rate: (atcOf(atc) || {}).rate || 0, ...x }));
  const byPayee = Object.entries(group(v => v.payeeId)).map(([id, x]) => { const c = contact(id) || {}; return { contactId: id, name: c.name || '', tin: c.tin || '', ...x }; });
  return { from, to, vat: { output: outputVat, input: inputVat, payable: round2(outputVat - inputVat) }, ewt: { total: round2(-(b[D.control.ewt] || 0)), byAtc, byPayee } };
}
// Aging: what each contact owes, or is owed, by how long past due. Sections that create open items
// register here: receivables when sales invoices and collections are built, payables with supplier bills.
// Each item: { contactId, ref, date, dueDate, amount, paid }.
const OPEN_ITEMS = { receivable: [], payable: [
  asOf => D.bills.filter(live).map(b => ({ contactId: b.payeeId, ref: b.ref, date: b.date, dueDate: b.dueDate || '', amount: b.payable, paid: billPaid(b.id, null, asOf) }))
] };
const AGING_BUCKETS = [['Current', -Infinity, 0], ['1–30 days', 1, 30], ['31–60 days', 31, 60], ['61–90 days', 61, 90], ['Over 90 days', 91, Infinity]];
function aging(kind, asOf) {
  const items = OPEN_ITEMS[kind].flatMap(f => f(asOf)).filter(i => i.date <= asOf && round2(i.amount - (i.paid || 0)) > 0);
  const by = {};
  items.forEach(i => {
    const late = daysBetween(i.dueDate || i.date, asOf), bucket = AGING_BUCKETS.find(([, lo, hi]) => late >= lo && late <= hi)[0], open = round2(i.amount - (i.paid || 0));
    const c = by[i.contactId] || (by[i.contactId] = { contactId: i.contactId, name: (contact(i.contactId) || {}).name || '', total: 0, buckets: Object.fromEntries(AGING_BUCKETS.map(x => [x[0], 0])) });
    c.buckets[bucket] = round2(c.buckets[bucket] + open); c.total = round2(c.total + open);
  });
  const rows = Object.values(by).sort((a, b) => a.name.localeCompare(b.name));
  return { kind, asOf, rows, total: sum(rows.map(r => r.total)), ready: OPEN_ITEMS[kind].length > 0 };
}
const receivablesAging = asOf => aging('receivable', asOf);
const payablesAging = asOf => aging('payable', asOf);
/* Every report the hub can produce. "needs" names the section that must exist before the report has data. */
const REPORTS = {
  incomeStatement: { label: 'Income statement', run: incomeStatement, needs: '' },
  balanceSheet: { label: 'Balance sheet', run: balanceSheet, needs: '' },
  trialBalance: { label: 'Trial balance', run: trialBalance, needs: '' },
  bankReconciliation: { label: 'Bank reconciliation', run: bankReconciliation, needs: '' },
  taxSummary: { label: 'Tax summary', run: taxSummary, needs: 'Sales invoices, for output VAT' },
  receivablesAging: { label: 'Receivables aging', run: receivablesAging, needs: 'Sales invoices and collections' },
  payablesAging: { label: 'Payables aging', run: payablesAging, needs: '' }
};

/* ---------- Numbering ---------- */
function suggestCv(dateIso) {
  const ym = (dateIso || todayIso()).slice(0, 7), pre = `CV${ym}-`;
  let max = 0;
  D.vouchers.forEach(v => { if (v.cv.startsWith(pre)) { const n = parseInt(v.cv.slice(pre.length), 10); if (n > max) max = n; } });
  return pre + pad(max + 1, 3);
}
function suggestCheckNo() {
  const last = D.vouchers.filter(v => v.checkNo).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];
  if (!last) return '';
  const m = last.checkNo.match(/^(.*?)(\d+)$/);
  if (!m) return '';
  return m[1] + pad(BigInt(m[2]) + 1n, m[2].length);
}

/* ---------- UI helpers ---------- */
const F = (id, label, input, cls = '') => `<div class="field ${cls}"><label for="${id}">${label}</label>${input}</div>`;
const inp = (id, v = '', type = 'text', attrs = '') => `<input id="${id}" type="${type}" value="${esc(v)}" ${attrs}>`;
const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}</option>`;

const pill = s => `<span class="pill p-${s.toLowerCase().replace(/\s+/g, '-')}">${esc(s)}</span>`;

}
const atcOptions = cur => `<option value="">No withholding</option>` + ATC.map(a => opt(a.code, `${a.code}, ${Math.round(a.rate * 100)}%, ${a.label}`, cur)).join('');

}
const voucherMonths = () => D.vouchers.filter(own).map(v => v.date.slice(0, 7));
function toast(msg, err) {

}
function table(cols, rows, emptyHtml, foot = '', rowCls = () => '') {

  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="${rowCls(r)}">${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.k(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot}</table></div>`;
}
const balLine = (dr, cr) => `<p class="balcheck ${dr === cr ? 'ok' : 'bad'}">${dr === cr ? 'Balanced. Total debits equal total credits.' : `Out of balance by ${peso(Math.abs(dr - cr))}. Report it before saving anything else.`}</p>`;

/* ---------- Logo ---------- */
function logo(kind, cls) {
  const L = LOGO[kind];
  return L.src ? `<img class="logo ${cls}" src="${L.src}" alt="${esc(COMPANY)}">` : `<span class="wordmark ${cls}" data-logo="${kind}" data-cls="${cls}">ACACIA</span>`;
}
function probeLogo(kind, i = 0) {
  const L = LOGO[kind];
  if (i >= L.files.length) return;
  const img = new Image();
  img.onload = () => { L.src = L.files[i]; document.querySelectorAll(`[data-logo="${kind}"]`).forEach(el => { el.outerHTML = logo(kind, el.dataset.cls); }); };
  img.onerror = () => probeLogo(kind, i + 1);
  img.src = L.files[i];
}

/* ---------- Modal ---------- */
let modalSave = null;
function openModal(title, body, onSave, saveLabel = 'Save', opts = {}) {
  document.getElementById('modal-root').innerHTML = `<div class="overlay"><div class="modal ${opts.size || ''}" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head"><h2 id="m-title">${title}</h2><button class="btn link" data-act="close-modal" aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><p class="form-err" id="m-err" role="alert"></p>${opts.extra || ''}<button class="btn ghost" data-act="close-modal">${onSave ? 'Cancel' : 'Close'}</button>${onSave ? `<button class="btn ${opts.danger ? 'dark' : ''}" data-act="save-modal">${saveLabel}</button>` : ''}</div>
  </div></div>`;
  modalSave = onSave;
  if (opts.onOpen) opts.onOpen();
  const first = document.querySelector('.modal-body input:not([disabled]):not([readonly]), .modal-body select');
  if (first && !opts.noFocus) first.focus();
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; modalSave = null; }
/* A form's save may wait on Google. Its buttons stay off until it answers; an error stays in the form. */
async function saveModal(extra) {
  if (saveModal.busy || !modalSave) return;
  const errEl = document.getElementById('m-err'), foot = document.querySelector('.modal-foot');
  const btns = foot ? [...foot.querySelectorAll('button')] : [];
  saveModal.busy = true; btns.forEach(b => { b.disabled = true; });
  errEl.textContent = '';
  try {
    const err = await modalSave(extra);
    if (err && document.getElementById('m-err')) document.getElementById('m-err').textContent = err;
  } catch (e) { console.error(e); if (document.getElementById('m-err')) document.getElementById('m-err').textContent = 'Couldn’t save: ' + e.message; }
  finally { saveModal.busy = false; btns.forEach(b => { b.disabled = false; }); }
}
const modalEl = () => document.querySelector('.modal');

/* ---------- Navigation: groups that hold today's pages and the ones coming later ---------- */

/* Screens before the books: sign-in, loading, setup, problems in the sheet. */
const gate = (inner, wide) => `<div class="gate"><div class="gate-card ${wide ? 'wide' : ''}"><div class="gate-logo">${logo('light', 'gate-img')}</div><div class="gate-eyebrow">${APP_NAME}</div>${inner}<div class="gate-foot">Bold. Rooted. Trusted.</div></div></div>`;
function gateScreen() {
  const err = `<p class="form-err gate-err" id="l-err" role="alert">${esc(S0.msg || '')}</p>`;
  switch (S0.screen) {
    case 'noconfig': return gate(`<h1>Not connected yet</h1><p class="lead">This copy of the hub doesn’t know which Google Sheet to use. Open <b>index.html</b>, find <code>PASTE_YOUR_WEB_APP_URL_HERE</code> near the top, replace it with the Apps Script web app URL, and upload the file again.</p>`);

function hit(v) {

}
function voucherList() {
  if (!D.vouchers.some(own)) return `<div class="empty"><b>No vouchers in ${YEAR}</b>${canBooks('vouchers.edit') ? `Start with this week’s checks. ${btn('new-voucher', 'New voucher', 'sm')}` : ''}</div>`;
  const rows = D.vouchers.filter(v => own(v) && hit(v) && (S.vf === 'all' || vStatus(v) === S.vf) && (!S.vm || v.date.startsWith(S.vm)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.cv.localeCompare(a.cv));
  const cols = [
    { h: 'CV no.', k: v => `<b>${esc(v.cv)}</b><span class="sub">${fdate(v.date)}</span>` },
    { h: 'Payee', k: v => `${esc(v.payeeName)}<span class="sub">${esc(v.particulars)}</span>` },

    { h: 'Status', k: v => pill(vStatus(v)) + (v.status === 'void' ? `<span class="sub">${esc(v.voidReason || '')}</span>` : v.clearedOn ? `<span class="sub">${fdate(v.clearedOn)}</span>` : '') },
    { h: '', k: v => rowActs([['view-voucher', v.id, 'View'], live(v) && ['print-voucher', v.id, 'Print'], live(v) && !isLocked(v.date) && canBooks('vouchers.edit') && ['edit-voucher', v.id, 'Edit']]) }
  ];
  const lv = rows.filter(live);

}

      if (!(a > 0)) return `${isBill ? 'Line' : 'Item'} ${i + 1}: enter an amount greater than zero.`;
    }
    if (c.lines.length && v.vatable && v.vatManual && (isNaN(numIn(v.vat)) || v.vat < 0 || v.vat >= c.gross)) return 'Input VAT must be zero or more, and less than the invoice total.';
    if (c.lines.length && v.atc && v.ewtManual && (isNaN(numIn(v.ewt)) || v.ewt < 0)) return 'EWT withheld must be zero or more.';
    if (v.tin && !TIN_RE.test(v.tin)) return 'Write the TIN as 000-000-000 or 000-000-000-000, or leave it blank.';
    if (controlIds().some(id => !acct(id))) return 'An account the hub posts to automatically (bank, Input VAT, withholding or payables) is missing from the chart of accounts.';
    if (!PAYEE_ROLES.includes(val('f-ptype'))) return 'Choose the payee type.';
    return '';
  };
  // Reuse the contact or create it; fill in TIN, usual account and withholding when missing.
  const savePayee = c => {
    let p = contactByName(v.payeeName);
    const ptype = val('f-ptype'), first = (c.lines[0] || {}).accountId || '';
    if (!p) { p = { id: nextId('p'), name: v.payeeName, tin: v.tin, address: '', accountId: first, atc: c.lines.length ? v.atc : '', vatable: v.vatable, roles: [ptype] }; D.contacts.push(p); }
    else { if (!isPayee(p)) p.roles.push(ptype); if (!p.tin && v.tin) p.tin = v.tin; if (!p.accountId && first) p.accountId = first; if (!p.atc && v.atc && c.lines.length) p.atc = v.atc; }
    return p;
  };
  const taxRec = c => ({ lines: c.lines.map(l => ({ accountId: l.accountId, desc: l.desc, amount: round2(numIn(l.amount)) })), vatable: v.vatable, vat: v.vatable ? c.vat : 0, vatManual: !!(v.vatable && v.vatManual && c.lines.length), atc: c.lines.length ? v.atc : '', ewt: c.ewt, ewtManual: !!(v.atc && v.ewtManual && c.lines.length) });
  const saveBill = () => {
    read();
    let c = compute();
    if (!v.ref) return 'Enter the invoice no.';
    if (!v.date) return 'Enter the invoice date.';
    if (!inYear(v.date)) return yearMsg(v.date);
    if (v.dueDate && v.dueDate < v.date) return 'The due date can’t be before the invoice date.';
    if (isLocked(v.date) || (edit && isLocked(v0.date))) return lockedMsg();
    if (!v.payeeName) return 'Enter the payee.';
    const pc = contactByName(v.payeeName);
    const dup = pc && D.bills.find(b => b.id !== self && live(b) && b.payeeId === pc.id && b.ref.toLowerCase() === v.ref.toLowerCase());
    if (dup) return `Invoice ${dup.ref} from ${pc.name} is already entered.`;
    if (!v.particulars) return 'Enter the particulars, so the bill says what it’s for.';
    const e = checkLines(c); if (e) return e;
    if (!c.lines.length) return 'Add what the bill is for: an account and an amount.';
    if (c.payable <= 0) return 'The amount payable must be more than zero.';
    if (c.dr !== c.cr) return 'The entry doesn’t balance. Check the VAT and withholding amounts.';
    if (paidSoFar > 0) {
      const payers = billPayers(v0.id).map(x => x.cv).join(', ');
      if (!pc || pc.id !== v0.payeeId) return `${payers} already pays this bill, so its payee can’t change. Take it off ${payers} first.`;
      if (c.payable < paidSoFar) return `${peso(paidSoFar)} has already been paid on this bill (${payers}), so the amount payable can’t be less than that.`;
      const firstPay = billPayers(v0.id).map(x => x.date).sort()[0];
      if (v.date > firstPay) return `${payers} paid this bill on ${fdate(firstPay)}, so the invoice date can’t be later than that.`;
    }
    return save('saveBill', () => {
      const p = savePayee(c);
      const apAccount = paidSoFar > 0 ? v0.apAccount : apFor(p.roles);
      const cb = calcBill({ ...v, apAccount });
      const rec = { ref: v.ref, date: v.date, dueDate: v.dueDate || '', payeeId: p.id, payeeName: p.name, tin: v.tin || p.tin || '', particulars: v.particulars, ...taxRec(cb),
        payable: cb.payable, apAccount, entry: cb.entry.filter(x => x.dr || x.cr), notes: v.notes };
      if (edit) Object.assign(billOf(self), rec);
      else D.bills.push({ id: nextId('b'), ...rec, status: 'active', voidReason: '', voidedOn: '', createdAt: '', updatedAt: '', createdBy: '', updatedBy: '' });
    }, () => toast(`Invoice ${v.ref} saved`));
  };
  const saveVoucher = andPrint => {
    read();
    const c = compute();
    if (!v.cv) return 'Enter the CV no.';
    if (D.vouchers.some(x => x.cv.toLowerCase() === v.cv.toLowerCase() && x.id !== self)) return `${v.cv} is already used. Each voucher needs its own CV no.`;
    if (!v.date) return 'Enter the voucher date.';
    if (!inYear(v.date)) return yearMsg(v.date);
    if (isLocked(v.date) || (edit && isLocked(v0.date))) return lockedMsg();
    if (!v.checkNo) return 'Enter the check no.';
    const dupChk = D.vouchers.find(x => x.checkNo.toLowerCase() === v.checkNo.toLowerCase() && x.id !== self);
    if (dupChk) return `Check ${v.checkNo} is already on ${dupChk.cv}${live(dupChk) ? '' : ' (void)'}. Each check number is used once.`;
    if (!v.checkDate) return 'Enter the check date.';
    if (edit && v0.clearedOn && v.checkDate > v0.clearedOn) return `This check cleared on ${fdate(v0.clearedOn)}, so its date can’t be later than that.`;
    if (!v.payeeName) return 'Enter the payee.';
    if (!v.particulars) return 'Enter the particulars, so the voucher says what it’s for.';
    for (const x of v.bills) {
      const b = billOf(x.billId), a = numIn(x.amount), bal = billBalance(b, self);
      if (!(a > 0)) return `Invoice ${b.ref}: enter the amount to pay.`;
      if (a > bal) return `Invoice ${b.ref}: the balance is ${peso(bal)}. Pay that or less.`;
      if (b.date > v.date) return `Invoice ${b.ref} is dated ${fdate(b.date)}, after this voucher. Date the voucher on or after the invoice.`;
    }
    const e = checkLines(c); if (e) return e;
    if (!c.lines.length && !c.pays.length) return 'Add what the check pays for: tick a bill, or pick an account and type an amount.';
    if (c.check <= 0) return 'The check amount must be more than zero.';
    if (c.dr !== c.cr) return 'The entry doesn’t balance. Check the VAT and withholding amounts.';
    let id = self;
    return save('saveVoucher', () => {
      const p = savePayee(c);
      const rec = { cv: v.cv, date: v.date, checkDate: v.checkDate, checkNo: v.checkNo, payeeId: p.id, payeeName: p.name, tin: v.tin || p.tin || '', particulars: v.particulars,
        bills: c.pays.map(x => ({ billId: x.billId, amount: x.amount, acct: x.acct })), ...taxRec(c), checkAmount: c.check, entry: c.entry.filter(x => x.dr || x.cr),
        earlierCv: v.earlierCv, notes: v.notes };
      if (edit) Object.assign(voucher(self), rec);
      else { id = nextId('v'); D.vouchers.push({ id, ...rec, status: 'active', clearedOn: '', voidReason: '', voidedOn: '', createdAt: '', updatedAt: '', createdBy: '', updatedBy: '' }); }
    }, map => {
      toast(`${v.cv} saved${andPrint ? '. Opening print.' : ''}`);
      if (andPrint) printVouchers([map[id] || id]);
    });
  };
  const title = isBill ? (edit ? `Edit Invoice ${esc(v0.ref)}` : 'New Supplier Bill') : (edit ? `Edit ${esc(v0.cv)}` : 'New Check Voucher');
  openModal(title, body, isBill ? saveBill : saveVoucher, 'Save', {
    size: 'wide', extra: isBill ? '' : `<button class="btn ghost" data-act="save-print">Save and print</button>`, noFocus: true,

      if (v.ewtManual) document.getElementById('f-ewt').value = v.ewt;
      update();
      const m = modalEl();
      m.addEventListener('input', e => {
        const t = e.target;
        m.dataset.dirty = '1';
        if (t.id === 'f-vat') v.vatManual = true;
        if (t.id === 'f-ptype') ptypeTouched = true;
        if (t.id === 'f-ewt') v.ewtManual = true;
        if (t.id === 'f-date' && !isBill && !edit) { const cvEl = document.getElementById('f-cv'); if (/^CV\d{4}-\d{2}-\d{3}$/.test(cvEl.value) && t.value) cvEl.value = suggestCv(t.value); }
        if (t.classList.contains('b-amt')) { t.closest('tr').querySelector('.b-pick').checked = t.value !== ''; read(); syncPart(); }
        update();
      });
      m.addEventListener('change', e => {
        const t = e.target;

        if (t.classList.contains('b-pick')) {

          read(); syncPart();

        if (t.id === 'f-payee') onPayee(); else update();
      });
      m.addEventListener('click', e => {
        const t = e.target;
        if (t.id === 'f-addline') { read(); v.lines.push(blankLine()); drawLines(); update(); }
        else if (t.classList.contains('l-del')) { m.dataset.dirty = '1'; read(); v.lines.splice(Number(t.dataset.i), 1); drawLines(); update(); }
        else if (t.id === 'f-vat-auto') { v.vatManual = false; update(); }
        else if (t.id === 'f-ewt-auto') { v.ewtManual = false; update(); }
      });
      document.getElementById(isBill && !edit ? 'f-ref' : 'f-payee').focus();
      if (v.payeeName) onPayee();
    }
  });
}

/* ---------- Books: monthly summary ---------- */
function summaryPage() {
  return pageHead('summary', 'Totals for the month by account, followed by bills, checks and taxes.')
    + `<div class="toolbar"><select id="sm" aria-label="Month">${yearMonths().map(m => opt(m, monthLabel(m), S.sm)).join('')}</select><span class="hint">By entry date. Void documents are left out.</span><span class="grow"></span>
      <span class="hint">${D.lockedThrough ? `Books locked through ${fdate(D.lockedThrough)}.` : 'No months locked.'}</span>
      ${can('months.lock') && D.lockedThrough && D.lockedThrough > `${D.closedThrough}-12-31` ? btn('unlock-month', `Unlock ${monthLabel(D.lockedThrough.slice(0, 7))}`, 'ghost') : ''}${canBooks('months.lock') && eom(S.sm) > (D.lockedThrough || '') ? btn('lock-month', `Lock ${monthLabel(S.sm)}`, 'ghost') : ''}${canCloseYear() ? btn('close-year', `Close the ${YEAR} books`, 'dark') : ''}</div><div id="list">${summaryBody()}</div>`;

/* January to December of the year on screen; the current year stops at this month. */
const yearMonths = () => { const last = YEAR === THIS_YEAR() ? TODAY().getMonth() + 1 : 12; return Array.from({ length: last }, (_, i) => `${YEAR}-${pad(i + 1, 2)}`).reverse(); };
function accountTotals(ym) {
  const t = {};
  journal(ym).forEach(d => d.lines.forEach(l => { const x = t[l.acct] || (t[l.acct] = { dr: 0, cr: 0 }); x.dr = round2(x.dr + l.dr); x.cr = round2(x.cr + l.cr); }));
  return Object.entries(t).map(([id, x]) => ({ id, a: acct(id) || { name: '(missing account)', type: '' }, ...x })).sort((p, q) => typeRank(p.a.type) - typeRank(q.a.type) || p.a.name.localeCompare(q.a.name));
}
function checksSummary(ym) {
  const vs = D.vouchers.filter(v => live(v) && own(v) && v.date.startsWith(ym));
  const end = eom(ym);
  const outstanding = D.vouchers.filter(v => live(v) && v.checkDate <= end && (!v.clearedOn || v.clearedOn > end));
  return { vs, gross: sum(vs.map(vGross)), vat: sum(vs.map(v => v.vat)), ewt: sum(vs.map(v => v.ewt)), billsPaid: sum(vs.flatMap(v => (v.bills || []).map(p => p.amount))), checks: sum(vs.map(v => v.checkAmount)), outstanding, outTotal: sum(outstanding.map(v => v.checkAmount)) };
}
function billsSummary(ym) {
  const bs = D.bills.filter(b => live(b) && own(b) && b.date.startsWith(ym)), end = eom(ym);
  const unpaid = D.bills.filter(b => live(b) && b.date <= end).map(b => billBalance(b, null, end)).filter(x => x > 0);
  return { bs, gross: sum(bs.map(vGross)), vat: sum(bs.map(b => b.vat)), ewt: sum(bs.map(b => b.ewt)), payable: sum(bs.map(b => b.payable)), unpaid: unpaid.length, unpaidTotal: sum(unpaid) };
}
function summaryBody() {
  const rows = accountTotals(S.sm), s = checksSummary(S.sm), bs = billsSummary(S.sm);
  if (!rows.length && !s.outstanding.length && !bs.unpaid) return `<div class="empty"><b>Nothing in ${monthLabel(S.sm)}</b>Entries dated this month will show here.</div>`;
  const dr = sum(rows.map(r => r.dr)), cr = sum(rows.map(r => r.cr));
  const tie = round2(s.billsPaid + s.gross - s.ewt - s.checks) === 0;
  return `${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Account</th><th>Type</th><th class="num">Debits</th><th class="num">Credits</th><th class="num">Net</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.a.name)}</td><td>${esc(r.a.type)}</td><td class="num">${r.dr ? money(r.dr) : ''}</td><td class="num">${r.cr ? money(r.cr) : ''}</td><td class="num">${money(r.dr - r.cr)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2">Total</td><td class="num">${money(dr)}</td><td class="num">${money(cr)}</td><td class="num">${money(dr - cr)}</td></tr></tfoot></table></div>${balLine(dr, cr)}` : ''}
    <h2 class="mt">Supplier Bills</h2>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Bills entered this month (${bs.bs.length}), invoice totals</td><td class="num">${money(bs.gross)}</td></tr>
      <tr><td>Withheld on those bills</td><td class="num">${money(bs.ewt)}</td></tr>
      <tr><td><b>Amount payable</b></td><td class="num"><b>${money(bs.payable)}</b></td></tr>
      <tr><td>Unpaid at month end (${bs.unpaid})<span class="sub">Every bill dated on or before ${fdate(eom(S.sm))}, less what checks dated by then paid. Compare with QuickBooks’ unpaid bills on that date.</span></td><td class="num">${money(bs.unpaidTotal)}</td></tr>
    </tbody></table></div>
    <h2 class="mt">Check Vouchers</h2>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Bills paid by check</td><td class="num">${money(s.billsPaid)}</td></tr>
      <tr><td>Items without a bill, invoice totals</td><td class="num">${money(s.gross)}</td></tr>
      <tr><td>Withheld on items without a bill</td><td class="num">${money(s.ewt)}</td></tr>
      <tr><td><b>Checks issued</b> (${s.vs.length})</td><td class="num"><b>${money(s.checks)}</b></td></tr>
      <tr><td>Outstanding at month end, not yet cleared (${s.outstanding.length})<span class="sub">The difference between the books and the ${esc(D.bankName)} statement on ${fdate(eom(S.sm))}.</span></td><td class="num">${money(s.outTotal)}</td></tr>
    </tbody></table></div>
    <p class="balcheck ${tie ? 'ok' : 'bad'}">${tie ? 'Ties out: bills paid, plus items less withholding, equal checks issued.' : 'Doesn’t tie out. Report it before saving anything else.'}</p>
    <h2 class="mt">Taxes</h2>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Input VAT, bills and checks</td><td class="num">${money(round2(bs.vat + s.vat))}</td></tr>
      <tr><td>EWT withheld, bills and checks, to remit with the 0619-E or 1601-EQ</td><td class="num">${money(round2(bs.ewt + s.ewt))}</td></tr>
    </tbody></table></div>`;
}

/* ---------- Closing a year ----------
   Lock through December 31 first. Closing writes next year's opening balances (income and expenses close
   to retained earnings), carries the unpaid bills and uncleared checks into next year, and freezes the year. */
const earliestOpenYear = () => Math.min(...(D.years || []).filter(y => y > (D.closedThrough || 0)).concat([YEAR]));
const canCloseYear = () => canBooks('year.close') && YEAR === earliestOpenYear() && (D.lockedThrough || '') >= `${YEAR}-12-31`;
function closeYearPlan() {
  const P = YEAR, next = P + 1, end = `${P}-12-31`, bal = {};
  journal().forEach(d => d.lines.forEach(l => { bal[l.acct] = round2((bal[l.acct] || 0) + (l.dr || 0) - (l.cr || 0)); }));
  let pl = 0; const lines = [];
  Object.entries(bal).forEach(([id, n]) => { if (!n) return; const a = acct(id); if (a && stmtOf(a.type)[0] === 'Income statement') pl = round2(pl + n); else lines.push({ acct: id, n }); });
  if (pl) { const re = lines.find(l => l.acct === D.control.retained); if (re) re.n = round2(re.n + pl); else lines.push({ acct: D.control.retained, n: pl }); }
  const yearOpening = { date: `${next}-01-01`, lines: lines.filter(l => Math.abs(l.n) >= 0.005).map(l => ({ acct: l.acct, memo: '', dr: l.n > 0 ? l.n : 0, cr: l.n < 0 ? -l.n : 0 })) };
  const bills = D.bills.filter(b => live(b) && !b.foreign && billBalance(b, null, end) > 0.004)
    .map(b => ({ ...b, from: P, paidBefore: billPaid(b.id, null, end), lines: [], entry: [], vatable: false, vat: 0, atc: '', ewt: 0, vatManual: false, ewtManual: false, createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  const vouchers = D.vouchers.filter(v => live(v) && !v.foreign && (!v.clearedOn || v.clearedOn > end))
    .map(v => ({ ...v, from: P, bills: [], lines: [], entry: [], vatable: false, vat: 0, atc: '', ewt: 0, vatManual: false, ewtManual: false, createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  return { P, next, yearOpening, bills, vouchers, pl };
}
function closeYearForm() {
  const c = closeYearPlan();
  openModal(`Close the ${c.P} Books`, `<p class="lead">This can’t be undone. Once ${c.P} is closed, nothing dated in ${c.P} can be added, changed or voided.</p>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Unpaid bills carried into ${c.next} (${c.bills.length})<span class="sub">Still payable in ${c.next}. Their lines and entries stay in ${c.P}.</span></td><td class="num">${peso(sum(c.bills.map(b => b.payable - b.paidBefore)))}</td></tr>
      <tr><td>Checks not cleared by December 31, carried into ${c.next} (${c.vouchers.length})<span class="sub">Mark them cleared in ${c.next}.</span></td><td class="num">${peso(sum(c.vouchers.map(v => v.checkAmount)))}</td></tr>
      <tr><td>${c.P} income less expenses, closed to retained earnings</td><td class="num">${money(-c.pl)}</td></tr>
      <tr><td>Accounts with a balance on January 1, ${c.next}</td><td class="num">${c.yearOpening.lines.length}</td></tr>
    </tbody></table></div>
    <div style="margin-top:20px">${F('cy-confirm', `Type ${c.P} to confirm`, inp('cy-confirm', '', 'text', 'inputmode="numeric" autocomplete="off"'))}</div>`, async () => {
    if (val('cy-confirm') !== String(c.P)) return `Type ${c.P} to confirm.`;
    const Dn = { ...D, bills: c.bills, vouchers: c.vouchers, yearOpening: c.yearOpening }, changes = [];
    TABLES.filter(t => ['Bills', 'Vouchers', 'Year opening'].includes(t.name))
      .forEach(t => Object.entries(groupRows(t, rowsWith(Dn, t))).forEach(([owner, rows]) => changes.push({ tab: tabName(t, c.next), owner, before: [], after: rows })));
    changes.push({ tab: 'Settings', owner: 'Years closed through', before: (RAW.Settings || {})['Years closed through'] || [], after: [['Years closed through', String(c.P)]] });
    const r = await send('closeYear', changes, [], { year: c.P });
    if (r.err) return r.err;
    if (r.handled) return;
    closeModal(); render(); toast(`${c.P} closed. ${c.bills.length} bill${c.bills.length === 1 ? '' : 's'} and ${c.vouchers.length} check${c.vouchers.length === 1 ? '' : 's'} carried into ${c.next}.`);
  }, `Close ${c.P}`, { danger: true, size: 'mid' });
}

  const want = spec.cols.filter(c => !c[3]).map(c => c[0]); // derived columns aren't read; optional and server ones are read when present

  if (missing.length) { errs.push(`The ${spec.name} tab is missing its ${missing.join(', ')} column${missing.length === 1 ? '' : 's'} (row 1).`); return []; }
  const idx = {}; head.forEach((h, i) => { if (h && idx[h] == null) idx[h] = i; });
  const out = [];
  for (const r of Object.keys(rows).map(Number).filter(r => r > 1).sort((a, b) => a - b)) {
    if (!want.some(h => rows[r][idx[h]] != null && String(rows[r][idx[h]]).trim() !== '')) continue;
    const o = { _row: r };

        else if (t === 'd') v = /^\d{4}-\d{2}-\d{2}$/.test(String(v).trim()) ? String(v).trim() : (errs.push(`${spec.name} row ${r}: ${h} isn’t a date. Type it as YYYY-MM-DD.`), null);

  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  if (LISTS[S.page]) { document.getElementById('list').innerHTML = LISTS[S.page](); return; }
  const pos = e.target.selectionStart; refreshMain(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
});
document.addEventListener('change', e => {
  const t = e.target;
  const relist = () => { document.getElementById('list').innerHTML = LISTS[S.page](); };
  if (t.id === 'vf') { S.vf = t.value; relist(); }
  else if (t.id === 'vm') { S.vm = t.value; relist(); }
  else if (t.id === 'bf') { S.bf = t.value; relist(); }
  else if (t.id === 'cf') { S.cf = t.value; refreshMain(); }
  else if (t.id === 'sm') { S.sm = t.value; refreshMain(); }
  else if (t.id === 'yr') switchYear(t.value);
  else if (t.id === 'cr') { S.cr = t.value; refreshMain(); }
});
window.addEventListener('afterprint', () => { document.body.classList.remove('pv'); document.getElementById('print-area').innerHTML = ''; });
/* Signed out after 3 hours without use, like the Inventory Hub. Apps Script ends the session at the same point. */
['click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (SESSION && Date.now() - (SESSION.last || 0) > 60000) touch(); }, true));
setInterval(() => { if (SESSION && Date.now() - (SESSION.last || 0) > IDLE_MS) signedOut('You were signed out after 3 hours without use.'); }, 60000);
/* Coming back to the tab picks up what others saved, unless a form is open. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S0.screen === 'app' && !document.querySelector('.overlay') && Date.now() - LOADED_AT > 120000) loadBooks(true);
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
probeLogo('light'); probeLogo('dark');
(function start() {
  if (!configured()) { S0.screen = 'noconfig'; render(); return; }
  SESSION = readSession();
  if (SESSION && Date.now() - (SESSION.last || 0) > IDLE_MS) { SESSION = null; saveSession(); S0.msg = 'You were signed out after 3 hours without use.'; }
  if (!SESSION) { S0.screen = 'login'; render(); return; }
  YEAR = Number(SESSION.year) || THIS_YEAR(); S.sm = YEAR === THIS_YEAR() ? todayIso().slice(0, 7) : `${YEAR}-12`;
  touch(); loadBooks();
})();

</script>
