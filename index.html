:root{
  --green:#22A749;--green7:#1A713E;--green05:#EDF8F0;
  --blue:#1B4DA0;--blue7:#15366B;--blue05:#EDF1F7;--blue1:#D6DFEE;--blue3:#A8BBDB;--sky:#EAF0FA;
  --mid:#12294E;--ink:#10213B;--carbon:#2C2C2C;--muted:#616161;--mist:#F5F5F5;--silver:#DDDDDD;
  --grad:linear-gradient(135deg,#22A749 0%,#1E7A74 50%,#1B4DA0 100%);
  --depth:linear-gradient(160deg,#12294E 0%,#10213B 100%);
  --display:"Montserrat","Avenir Next","Segoe UI",Arial,sans-serif;
  --body:"Open Sans","Montserrat",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --shadow:0 12px 32px rgba(27,77,160,.12);--lift:0 20px 48px rgba(27,77,160,.18);
  --rest:0 1px 2px rgba(16,33,59,.05),0 8px 24px rgba(27,77,160,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.55 var(--body);color:var(--carbon);background:#fff;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
tr.more td{text-align:center;color:var(--muted);font-size:12.5px;padding:14px}
.over{color:#B42318;font-weight:700}
.field.gone{display:none}
.tbl-wrap.budget{overflow-x:auto}.budget table{font-size:12.5px}.budget th,.budget td{padding-left:8px;padding-right:8px;white-space:nowrap}.budget td:first-child{white-space:normal;min-width:180px}
.logpart+.logpart{margin-top:8px}.logtab{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.logchg{white-space:pre-line;font-size:13px;overflow-wrap:anywhere}
.mt{margin:40px 0 14px;font-size:18px;font-weight:700;letter-spacing:-.01em}
.btn{border:0;border-radius:8px;padding:11px 20px;font:700 14px/1.2 var(--display);cursor:pointer;background:var(--blue);color:#fff;transition:background .2s,transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--blue7);transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,77,160,.18)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.ghost:hover{background:var(--blue05)}
.btn.dark{background:var(--ink)}
.btn.dark:hover{background:var(--mid)}
.btn.link{background:none;color:var(--blue);padding:4px 8px;box-shadow:none}
.btn.link:hover{background:var(--blue05);transform:none;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.link.sm{padding:4px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.span2{grid-column:span 2}.full{grid-column:1/-1}
.field label{font:600 12.5px var(--display);color:var(--ink)}
input,select,textarea{height:42px;border:1px solid var(--silver);border-radius:8px;padding:0 12px;background:#fff;width:100%;transition:border-color .2s}
textarea{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue05)}
input:disabled,input[readonly]{background:var(--mist);color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);padding:0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.form-err{color:var(--ink);font-size:13.5px;font-weight:600;margin:0 auto 0 0;min-height:1em}
.form-err:not(:empty){background:var(--sky);box-shadow:inset 4px 0 0 var(--blue);padding:10px 14px 10px 18px;border-radius:8px}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:32px 16px 20px}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:linear-gradient(180deg,#22A749 0%,#1E7A74 50%,#1B4DA0 100%)}
.brand{padding:0 12px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.wordmark{font:800 20px/1 var(--display);letter-spacing:.16em}
.brand-sub{font:600 12px var(--display);letter-spacing:.04em;opacity:.6}
img.logo{display:block;width:auto;height:auto;object-fit:contain}
img.side-logo{max-width:172px;max-height:76px}
img.dv-logo{max-width:200px;max-height:60px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.nav-label{font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);padding:0 12px 6px}
.ver{opacity:.45}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;font:600 14px var(--display);transition:background .2s,color .2s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 3px 0 0 var(--green)}
.side-foot{margin-top:auto;padding:20px 12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.yr{display:flex;flex-direction:column;gap:6px;padding:0 12px 24px;font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.yr select{height:38px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);font:700 15px var(--display);letter-spacing:0;text-transform:none}
.yr select option{color:var(--ink)}
.side-foot .who{font:700 13.5px var(--display);color:#fff}
.side-foot .role{opacity:.6;margin-bottom:6px}
.side-foot .lnk{background:none;border:0;padding:2px 0;color:rgba(255,255,255,.75);font:600 12.5px var(--display);text-align:left;cursor:pointer}
.side-foot .lnk:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.main{padding:48px 56px 128px;min-width:0;background:var(--mist)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--silver)}
.eyebrow{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--green7);margin-bottom:10px}
.page-head h1{font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.head-acts{display:flex;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{max-width:320px}
.toolbar select,.toolbar input[type=month],.toolbar input[type=date]{width:auto;min-width:160px}
.toolbar .grow{flex:1}
.tbl-wrap{overflow-x:auto;border-radius:12px;background:#fff;box-shadow:var(--rest)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--blue);color:#fff;text-align:left;font:700 11.5px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;white-space:nowrap}
td{padding:10px 16px;vertical-align:top;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:var(--mist)}
table:not(.compact) tbody tr:not(.jrow):hover td{background:var(--blue05)}
tfoot td{font-weight:700;background:var(--blue05);border-top:2px solid var(--blue1)}
tr.void td{color:var(--muted)}
tr.void td .amt{text-decoration:line-through}
td .acts{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}
td.cr{padding-left:40px}
table.compact td{padding:8px 10px;vertical-align:middle}
table.compact th{padding:10px;font-size:11px}
.modal .tbl-wrap,.entry .tbl-wrap{box-shadow:inset 0 0 0 1px var(--silver)}
table.compact input,table.compact select{height:38px;padding:0 10px;font-size:14px}
.empty{border:1.5px dashed var(--blue3);border-radius:12px;padding:56px 24px;text-align:center;color:var(--muted);background:#fff}

.checkamt .big{font:800 30px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.entry{border-radius:12px;background:var(--sky);box-shadow:inset 4px 0 0 var(--blue);padding:20px 24px}

.warnline{font-size:13px;color:var(--ink);font-weight:600;margin-top:6px}

const journal = (ym, src) => Object.entries(SOURCES).filter(([k]) => !src || k === src).flatMap(([, s]) => s.docs())
  .filter(d => !ym || d.date.startsWith(ym)).sort((a, b) => a.date.localeCompare(b.date) || a.ref.localeCompare(b.ref));

/* ---------- Financial reports: calculations only, no screen yet ----------
   Read every journal entry (opening balances included) and group accounts by STATEMENT.
   Amounts are shown with their normal sign: revenue and liabilities positive as credits. */
const STMT_SECTIONS = { 'Income statement': ['Revenue', 'Cost of sales', 'Operating expenses', 'Other income', 'Other expenses'], 'Balance sheet': ['Current assets', 'Noncurrent assets', 'Current liabilities', 'Noncurrent liabilities', 'Equity'] };
function balances(from, to) {
  const b = {};
  journal().filter(d => (!from || d.date >= from) && (!to || d.date <= to)).forEach(d => d.lines.forEach(l => { b[l.acct] = round2((b[l.acct] || 0) + (l.dr || 0) - (l.cr || 0)); }));
  return b;
}
function statementSections(b, statement) {
  const out = {};
  STMT_SECTIONS[statement].forEach(sec => { out[sec] = []; });
  sortAccounts(D.accounts).forEach(a => { const [st, sec, sign] = stmtOf(a.type); if (st === statement && b[a.id]) out[sec].push({ id: a.id, name: a.name, amount: round2(b[a.id] * sign) }); });
  return out;
}
const sectionTotal = rows => sum(rows.map(r => r.amount));
function incomeStatement(from, to) {
  const s = statementSections(balances(from, to), 'Income statement'), t = {};
  STMT_SECTIONS['Income statement'].forEach(sec => { t[sec] = sectionTotal(s[sec]); });
  const grossProfit = round2(t.Revenue - t['Cost of sales']), operatingIncome = round2(grossProfit - t['Operating expenses']);
  return { from, to, sections: s, totals: { ...t, grossProfit, operatingIncome, netIncome: round2(operatingIncome + t['Other income'] - t['Other expenses']) } };
}
function balanceSheet(asOf) {
  const b = balances('', asOf), s = statementSections(b, 'Balance sheet'), t = {};
  STMT_SECTIONS['Balance sheet'].forEach(sec => { t[sec] = sectionTotal(s[sec]); });
  // income and expenses not yet closed to retained earnings belong to equity
  const earnings = round2(-sum(D.accounts.filter(a => stmtOf(a.type)[0] === 'Income statement').map(a => b[a.id] || 0)));
  const assets = round2(t['Current assets'] + t['Noncurrent assets']), liabilities = round2(t['Current liabilities'] + t['Noncurrent liabilities']), equity = round2(t.Equity + earnings);
  return { asOf, sections: s, totals: { ...t, assets, liabilities, earnings, equity, balanced: round2(assets - liabilities - equity) === 0 } };
}

// Trial balance: every account with a balance on a date, debits and credits side by side.
function trialBalance(asOf) {
  const b = balances('', asOf);
  const rows = sortAccounts(D.accounts).filter(a => b[a.id]).map(a => ({ id: a.id, name: a.name, type: a.type, debit: b[a.id] > 0 ? b[a.id] : 0, credit: b[a.id] < 0 ? round2(-b[a.id]) : 0 }));
  const debit = sum(rows.map(r => r.debit)), credit = sum(rows.map(r => r.credit));
  return { asOf, rows, totals: { debit, credit, balanced: debit === credit } };
}
// Bank reconciliation: the bank statement's ending balance, less checks not yet cleared on that date,
// should equal the hub's bank balance. Deposits in transit join here once collections exist.
function bankReconciliation(asOf, statementBalance, bankId) {
  const book = round2(balances('', asOf)[bankId || D.control.bank] || 0);
  const outstanding = D.vouchers.filter(v => isCheck(v) && (v.bankAcct || D.control.bank) === (bankId || D.control.bank) && liveAt(v, asOf) && v.checkDate <= asOf && (!v.clearedOn || v.clearedOn > asOf))
    .sort((a, b) => a.checkDate.localeCompare(b.checkDate)).map(v => ({ id: v.id, cv: v.cv, checkNo: v.checkNo, checkDate: v.checkDate, payee: v.payeeName, amount: v.checkAmount }));
  const outstandingTotal = sum(outstanding.map(o => o.amount));
  const adjustedBank = round2(Number(statementBalance) - outstandingTotal);
  return { asOf, bankAccount: acctName(bankId || D.control.bank), statementBalance: round2(Number(statementBalance)), outstanding, outstandingTotal, depositsInTransit: [], adjustedBank, bookBalance: book, difference: round2(adjustedBank - book) };
}
/* Documents booked in a period, each with a sign: +1 for its entry, -1 for its reversal when it was voided in the period. */
const signedDocs = (list, from, to) => list.filter(own).flatMap(d => {
  const out = [], inP = x => x && x >= from && x <= to;
  if (posted(d) && inP(entryDate(d))) out.push({ d, s: 1 });
  if (reversed(d) && inP(d.voidedOn)) out.push({ d, s: -1 });
  return out;
});
// Tax summary for a period: VAT payable (output less input) and withholding to remit, by ATC and by payee
// (the payee list is what the 2307 certificates and the quarterly withholding report need).
const outputVatAccount = () => acct(D.control.outputVat) || D.accounts.find(a => a.name === 'Output VAT');
function taxSummary(from, to) {
  const b = balances(from, to), ov = outputVatAccount();
  const outputVat = ov ? round2(-(b[ov.id] || 0)) : 0, inputVat = round2(b[D.control.inputVat] || 0);
  const vs = signedDocs([...D.bills, ...D.vouchers].filter(v => v.atc), from, to);
  const group = key => { const g = {}; vs.forEach(({ d: v, s }) => { const k = key(v); const x = g[k] || (g[k] = { base: 0, ewt: 0, count: 0 }); x.base = round2(x.base + s * round2(vGross(v) - v.vat)); x.ewt = round2(x.ewt + s * v.ewt); x.count += s; }); return g; };
  const byAtc = Object.entries(group(v => v.atc)).map(([atc, x]) => ({ atc, rate: (atcOf(atc) || {}).rate || 0, ...x }));
  const byPayee = Object.entries(group(v => v.payeeId)).map(([id, x]) => { const c = contact(id) || {}; return { contactId: id, name: c.name || '', tin: c.tin || '', ...x }; });
  return { from, to, vat: { output: outputVat, input: inputVat, payable: round2(outputVat - inputVat) }, ewt: { total: round2(-(b[D.control.ewt] || 0)), byAtc, byPayee } };
}
// Aging: what each contact owes, or is owed, by how long past due. Sections that create open items
// register here: receivables when sales invoices and collections are built, payables with supplier bills.
// Each item: { contactId, ref, date, dueDate, amount, paid }.
/* Memos not yet used show as credits, which is what they are: a negative open item. */
const OPEN_ITEMS = { receivable: [
  asOf => (D.invoices || []).filter(i => liveAt(i, asOf) && !i.appliesTo).map(i => { const s = isMemo(i) ? -1 : 1; return { contactId: i.customerId, ref: i.ref, date: i.date, dueDate: i.dueDate || '', amount: s * i.receivable, paid: s * invReceived(i.id, null, asOf) }; })
], payable: [
  asOf => D.bills.filter(b => liveAt(b, asOf) && !b.appliesTo).map(b => { const s = isMemo(b) ? -1 : 1; return { contactId: b.payeeId, ref: b.ref, date: b.date, dueDate: b.dueDate || '', amount: s * pesoOf(b, b.payable), paid: s * pesoOf(b, billPaid(b.id, null, asOf)) }; })
] };
const AGING_BUCKETS = [['Current', -Infinity, 0], ['1–30 days', 1, 30], ['31–60 days', 31, 60], ['61–90 days', 61, 90], ['Over 90 days', 91, Infinity]];
function aging(kind, asOf) {
  const items = OPEN_ITEMS[kind].flatMap(f => f(asOf)).filter(i => i.date <= asOf && Math.abs(round2(i.amount - (i.paid || 0))) > 0.004);
  const by = {};
  items.forEach(i => {
    const late = daysBetween(i.dueDate || i.date, asOf), bucket = AGING_BUCKETS.find(([, lo, hi]) => late >= lo && late <= hi)[0], open = round2(i.amount - (i.paid || 0));
    const c = by[i.contactId] || (by[i.contactId] = { contactId: i.contactId, name: (contact(i.contactId) || {}).name || '', total: 0, buckets: Object.fromEntries(AGING_BUCKETS.map(x => [x[0], 0])) });
    c.buckets[bucket] = round2(c.buckets[bucket] + open); c.total = round2(c.total + open);
  });
  const rows = Object.values(by).sort((a, b) => a.name.localeCompare(b.name));
  return { kind, asOf, rows, total: sum(rows.map(r => r.total)), ready: OPEN_ITEMS[kind].length > 0 };
}
const receivablesAging = asOf => aging('receivable', asOf);
const payablesAging = asOf => aging('payable', asOf);

/* ---------- Numbering ---------- */
function suggestCv(dateIso, prefix = 'CV') {
  const ym = (dateIso || todayIso()).slice(0, 7), pre = `${prefix}${ym}-`;
  let max = 0;
  D.vouchers.forEach(v => { if (v.cv.startsWith(pre)) { const n = parseInt(v.cv.slice(pre.length), 10); if (n > max) max = n; } });
  return pre + pad(max + 1, 3);
}
function suggestCheckNo() {
  const last = D.vouchers.filter(v => v.checkNo && isCheck(v)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0];
  if (!last) return '';
  const m = last.checkNo.match(/^(.*?)(\d+)$/);
  if (!m) return '';
  return m[1] + pad(BigInt(m[2]) + 1n, m[2].length);
}

}

function table(cols, rows, emptyHtml, foot = '', rowCls = () => '') {
  if (!rows.length) return `<div class="empty">${emptyHtml}</div>`;
  const tr = r => `<tr class="${rowCls(r)}">${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.k(r)}</td>`).join('')}</tr>`;
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${chunked(rows, tr, cols.length)}</tbody>${foot}</table></div>`;
}
/* Long lists draw their first rows at once and the rest as they scroll into view, so a year of vouchers
   opens as fast as a week of them. Totals are worked out from every row, drawn or not. Without
   IntersectionObserver (old browsers) everything draws at once. */
const CHUNK = 120, MORE = new Map();
let moreSeq = 0, moreObs = null;
function chunked(items, draw, colspan) {
  if (items.length <= CHUNK || !('IntersectionObserver' in window)) return items.map(draw).join('');
  const id = 'm' + (++moreSeq);
  MORE.set(id, { items, draw, at: CHUNK, colspan });
  if (MORE.size > 40) MORE.delete(MORE.keys().next().value);
  return items.slice(0, CHUNK).map(draw).join('') + moreRow(id);
}
const moreRow = id => { const m = MORE.get(id); return `<tr class="more" data-more="${id}"><td colspan="${m.colspan}">Showing ${m.at.toLocaleString('en-US')} of ${m.items.length.toLocaleString('en-US')}. Scroll for more.</td></tr>`; };
function drawMore(el) {
  const m = MORE.get(el.dataset.more);
  if (!m) { el.remove(); return; }
  const next = m.items.slice(m.at, m.at + CHUNK * 2);
  m.at += next.length;
  el.insertAdjacentHTML('beforebegin', next.map(m.draw).join(''));
  if (m.at >= m.items.length) { moreObs.unobserve(el); el.remove(); MORE.delete(el.dataset.more); }
  else el.firstElementChild.textContent = `Showing ${m.at.toLocaleString('en-US')} of ${m.items.length.toLocaleString('en-US')}. Scroll for more.`;
}

function voidBill(id) {
  const b = billOf(id);
  if (!b || !own(b) || !live(b)) return;
  const blocked = voidBlocked(); if (blocked) { toast(blocked, true); return; }
  const payers = billPayers(id);
  if (payers.length) { toast(`${payers.map(settlerRef).join(', ')} ${isMemo(b) ? 'uses this memo' : 'settles this bill'}. Void that, or take it off, first.`, true); return; }
  // a check that paid it until it was voided keeps it paid until then, so the bill's void comes after
  const from = [b.date, ...D.vouchers.filter(v => reversed(v) && (v.bills || []).some(p => p.billId === id)).map(v => v.voidedOn)].sort().pop();
  openModal(`Void Invoice ${esc(b.ref)}`, `<p class="lead">Use this for a bill entered by mistake or cancelled by the supplier. The bill stays on record, marked void. Its entry stays in ${monthLabel(b.date.slice(0, 7))} and is reversed on the void date.</p>
    <div class="fields" style="grid-template-columns:minmax(150px,1fr) 2fr">${voidFields(from)}${F('m-reason', 'Reason', inp('m-reason', '', 'text', 'placeholder="e.g. Entered twice, supplier cancelled"'))}</div>`, () => {
    const reason = val('m-reason'), d = val('m-vdate'), err = voidDateErr(d, from, from === b.date ? undefined : 'when the last check paying it was voided');
    if (err) return err;
    if (!reason) return 'Enter the reason. It’s kept on the bill.';
    return save('voidBill', () => { Object.assign(billOf(id), { status: 'void', voidReason: reason, voidedOn: d }); }, () => toast(`Invoice ${b.ref} voided on ${fdate(d)}`));
  }, 'Void bill', { danger: true });
}

/* January to December of the year on screen; the current year stops at this month. */
const yearMonths = () => { const last = YEAR === THIS_YEAR() ? TODAY().getMonth() + 1 : 12; return Array.from({ length: last }, (_, i) => `${YEAR}-${pad(i + 1, 2)}`).reverse(); };
function accountTotals(ym) {
  const t = {};
  journal(ym).forEach(d => d.lines.forEach(l => { const x = t[l.acct] || (t[l.acct] = { dr: 0, cr: 0 }); x.dr = round2(x.dr + l.dr); x.cr = round2(x.cr + l.cr); }));
  return Object.entries(t).map(([id, x]) => ({ id, a: acct(id) || { name: '(missing account)', type: '' }, ...x })).sort((p, q) => typeRank(p.a.type) - typeRank(q.a.type) || p.a.name.localeCompare(q.a.name));
}
/* A month's documents as booked: each entry dated in the month counts, and a void in the month takes it back out. */
const signedSum = (xs, f) => round2(sum(xs.map(({ d, s }) => s * f(d))));

  const end = eom(ym), xs = signedDocs(D.vouchers.filter(isCheck), `${ym}-01`, end);

  return { count: sum(xs.map(x => x.s)), voids: xs.filter(x => x.s < 0).length, gross: signedSum(xs, vGross), ewt: signedSum(xs, v => v.ewt),
    billsPaid: signedSum(xs, v => sum((v.bills || []).map(p => p.amount))), checks: signedSum(xs, v => v.checkAmount), outstanding, outTotal: sum(outstanding.map(v => v.checkAmount)) };
}
function billsSummary(ym) {
  const end = eom(ym), xs = signedDocs(D.bills.filter(b => !isMemo(b)), `${ym}-01`, end), ms = signedDocs(D.bills.filter(isMemo), `${ym}-01`, end);
  const unpaid = D.bills.filter(b => liveAt(b, end) && b.date <= end && !isMemo(b)).map(b => pesoOf(b, billBalance(b, null, end))).filter(x => x > 0);
  return { count: sum(xs.map(x => x.s)), voids: xs.filter(x => x.s < 0).length, gross: signedSum(xs, b => pesoOf(b, vGross(b))), ewt: signedSum(xs, b => b.ewt), payable: signedSum(xs, b => pesoOf(b, b.payable)), unpaid: unpaid.length, unpaidTotal: sum(unpaid), usd: xs.some(x => x.d.currency === 'USD'),
    memos: sum(ms.map(x => x.s)), memoTotal: signedSum(ms, b => pesoOf(b, b.payable)) };

/* Sales and what came in for them in a month. Unpaid at month end is each invoice dated by then, less what was

/* ---------- Closing a year ----------
   Lock through December 31 first. Closing writes next year's opening balances (income and expenses close
   to retained earnings), carries the unpaid bills and uncleared checks into next year, and freezes the year. */
const earliestOpenYear = () => Math.min(...(D.years || []).filter(y => y > (D.closedThrough || 0)).concat([YEAR]));
const canCloseYear = () => canBooks('year.close') && YEAR === earliestOpenYear() && (D.lockedThrough || '') >= `${YEAR}-12-31`;
function closeYearPlan() {
  const P = YEAR, next = P + 1, end = `${P}-12-31`, bal = {}, usd = {};
  // goods in transit carries over by shipment, employee advances by employee
  journal().forEach(d => d.lines.forEach(l => { const k = tagKind(l.acct) ? `${l.acct}|${l.tag || ''}` : l.acct; bal[k] = round2((bal[k] || 0) + (l.dr || 0) - (l.cr || 0)); if (l.usd) usd[l.acct] = round2((usd[l.acct] || 0) + (l.dr ? l.usd : -l.usd)); }));
  let pl = 0; const lines = [];
  Object.entries(bal).forEach(([k, n]) => { if (!n) return; const [id, tag] = k.split('|'), a = acct(id); if (a && stmtOf(a.type)[0] === 'Income statement') pl = round2(pl + n); else lines.push({ acct: id, n, ...(tag ? { tag } : {}) }); });
  if (pl) { const re = lines.find(l => l.acct === D.control.retained); if (re) re.n = round2(re.n + pl); else lines.push({ acct: D.control.retained, n: pl }); }
  const yearOpening = { date: `${next}-01-01`, lines: lines.filter(l => Math.abs(l.n) >= 0.005).map(l => ({ acct: l.acct, memo: '', dr: l.n > 0 ? l.n : 0, cr: l.n < 0 ? -l.n : 0, ...(usd[l.acct] ? { usd: Math.abs(usd[l.acct]) } : {}), ...(l.tag ? { tag: l.tag } : {}) })) };
  const bills = D.bills.filter(b => live(b) && !b.foreign && billBalance(b, null, end) > 0.004)
    .map(b => ({ ...b, from: P, paidBefore: billPaid(b.id, null, end), lines: [], entry: [], vatable: false, vat: 0, atc: '', ewt: 0, vatManual: false, ewtManual: false, createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  const vouchers = D.vouchers.filter(v => live(v) && !v.foreign && isCheck(v) && (!v.clearedOn || v.clearedOn > end))
    .map(v => ({ ...v, from: P, bills: [], lines: [], entry: [], vatable: false, vat: 0, atc: '', ewt: 0, vatManual: false, ewtManual: false, createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  const invoices = (D.invoices || []).filter(i => live(i) && !i.foreign && !i.appliesTo && invBalance(i, null, end) > 0.004)
    .map(i => ({ ...i, from: P, paidBefore: invReceived(i.id, null, end), lines: [], entry: [], vatManual: false, createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  const collections = (D.collections || []).filter(c => live(c) && !c.foreign && toDeposit(c) && !colDeposited(c, null, end))
    .map(c => ({ ...c, from: P, invoices: [], deductions: [], cwt: 0, entry: [], createdAt: '', createdBy: '', updatedAt: '', updatedBy: '' }));
  return { P, next, yearOpening, bills, vouchers, invoices, collections, pl };
}

    <div class="tbl-wrap"><table><tbody>

    busy('Saving…');
    try { await api('changePassword', { current: cur, next }); }
    catch (e) { if (e.code === 'auth') { closeModal(); signedOut(e.message); return; } return e.message; }
    finally { busy(''); }
    closeModal(); toast('Password changed');
  }, 'Change password');
}

/* ---------- Signing in and out ---------- */
async function signIn() {
  const username = val('l-user'), password = document.getElementById('l-pass').value, errEl = document.getElementById('l-err'), b = document.getElementById('l-btn');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'Enter your username and password.'; return; }
  b.disabled = true; b.textContent = 'Signing in…';
  try {
    const r = await api('login', { username, password });
    SESSION = { token: r.token, user: r.user, last: Date.now(), year: THIS_YEAR() }; saveSession(); YEAR = THIS_YEAR(); S.sm = todayIso().slice(0, 7);
    await loadBooks();
  } catch (e) {
    if (document.getElementById('l-err')) { errEl.textContent = e.message; b.disabled = false; b.textContent = 'Sign in'; }
  }
}
function signedOut(msg) {
  SESSION = null; USERS = null; ROLE_LIST = null; LAST = null; saveSession();
  D = emptyData(); RAW = {};
  closeModal();
  S0.screen = 'login'; S0.msg = msg || '';
  render();
}
function signOut() {
  if (SESSION) api('logout').catch(() => {});
  signedOut('');
}
async function setupBooks() {
  const b = document.getElementById('setup-btn'), errEl = document.getElementById('l-err');
  b.disabled = true; b.textContent = 'Setting up…'; errEl.textContent = '';
  const fresh = freshData(), changes = [];
  TABLES.forEach(t => Object.entries(groupRows(t, rowsWith(fresh, t))).forEach(([owner, rows]) => changes.push({ tab: tabName(t), owner, before: [], after: rows })));
  try { await api('commit', { kind: 'setupBooks', changes, newIds: [], spec: SPEC(), create: TABLES.map(t => tabName(t)), ...loadReq() }); await loadBooks(); toast('Books set up'); }
  catch (e) {
    if (e.code === 'auth') return signedOut(e.message);
    if (document.getElementById('l-err')) { errEl.textContent = e.message; b.disabled = false; b.textContent = 'Set up the books'; }
  }
}

  journal().forEach(d => { if ((asOf && d.date > asOf) || (exceptId && d.id === exceptId)) return; d.lines.forEach(l => { if (l.tag) m[l.tag] = round2((m[l.tag] || 0) + (l.dr || 0) - (l.cr || 0)); }); });
  if (!asOf && !exceptId) TAGBAL.set(D, m);

}

/* The month's inventory, shipments and staff expenses, for the monthly summary. */

/* ---------- Payables: bank transfers ----------
   Payments sent from a bank account (telegraphic transfers, online and InstaPay or PESONet payments) work like
   check vouchers: they pay bills or items, and print as a payment voucher. Moving money between the company's
   own accounts is a transfer of its own, kept with the journal entries. */

  const months = [...new Set(D.vouchers.filter(v => own(v) && isTransfer(v)).map(v => entryDate(v).slice(0, 7)).concat((D.journals || []).filter(j => j.kind === 'Transfer').map(j => j.date.slice(0, 7))))].sort().reverse();
  return pageHead('transfers', 'Payments sent from the bank, telegraphic transfers included, and money moved between the company’s own accounts.',
    canBooks('transfers.edit') ? `${btn('new-move', 'Move between accounts', 'ghost')}${btn('new-transfer', 'New payment')}` : '')
    + bankStrip()
    + `<div class="toolbar"><input id="q" type="search" placeholder="Search PV or BT no., payee, reference, particulars" value="${esc(S.q)}" aria-label="Search">
      <select id="tm" aria-label="Month"><option value="">All months</option>${months.map(m => opt(m, monthLabel(m), S.tm)).join('')}</select></div>
    <div id="list">${transferList()}</div>`;
}
/* Every bank account with money in it, today or at the end of the year on screen. */
function bankStrip() {
  const asOf = YEAR === THIS_YEAR() ? todayIso() : `${YEAR}-12-31`;
  const bal = {}; Object.entries(D.acctBefore || {}).forEach(([k, x]) => { bal[k] = { php: x.php || 0, usd: x.usd || 0 }; });
  journal().forEach(d => { if (d.date > asOf) return; d.lines.forEach(l => { const x = bal[l.acct] || (bal[l.acct] = { php: 0, usd: 0 }); x.php = round2(x.php + (l.dr || 0) - (l.cr || 0)); if (l.usd) x.usd = round2(x.usd + (l.dr ? l.usd : -l.usd)); }); });
  const rows = bankAccounts().map(a => { const x = bal[a.id] || { php: 0, usd: 0 }; return { a, b: { ...x, rate: x.usd > 0 ? Math.round(x.php / x.usd * 10000) / 10000 : 0 }, cur: bankCur(a.id) }; }).filter(x => x.b.php || x.b.usd || x.a.id === D.control.bank);
  if (!rows.length) return '';
  return `<section style="margin-bottom:28px"><h2 class="mt" style="margin-top:0">Bank Balances <span class="hint" style="font-weight:400">as of ${fdate(asOf)}, per the books</span></h2>${table([
    { h: 'Account', k: x => `<b>${esc(x.a.name)}</b>${bankInfo(x.a.id).number ? `<span class="sub">${esc(bankInfo(x.a.id).number)}</span>` : ''}` },
    { h: 'Currency', k: x => x.cur === 'USD' ? 'US dollars' : 'Pesos' },
    { h: 'Dollars', num: 1, k: x => x.cur === 'USD' ? amt(x.b.usd, 'USD') : '' },
    { h: 'Rate', num: 1, k: x => x.cur === 'USD' && x.b.rate ? fmtRate(x.b.rate) : '' },
    { h: 'In pesos', num: 1, k: x => peso(x.b.php) }
  ], rows, '')}</section>`;
}

/* Numbers: BT and JE run by month, like CV and PV. */

const renumber = (fieldId, date, prefix, edit) => { const el = document.getElementById(fieldId); if (!edit && date && new RegExp(`^${prefix}\\d{4}-\\d{2}-\\d{3}$`).test(el.value)) el.value = suggestJe(date, prefix); };

  }); });

    else out.push({ time: r.time, user: r.user, action: r.action, record: r.record, ref: r.ref, parts: [r] });

  'edit-user': id => userForm(id),
  'change-password': passwordForm,
  'sign-in': signIn,
  'sign-out': signOut,
  'setup-books': setupBooks,
  reload: () => loadBooks()
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const f = ACT[b.dataset.act];
  if (!f) return;
  e.preventDefault();
  try { f(b.dataset.id, b); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, true); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S0.screen === 'login' && (e.target.id === 'l-user' || e.target.id === 'l-pass')) { e.preventDefault(); signIn(); return; }
  if (e.key === 'Enter' && e.target.id === 'lq') { e.preventDefault(); LOG.q = e.target.value.trim(); loadLog(); return; }
  if (e.key !== 'Escape' || !document.querySelector('.overlay')) return;
  const m = modalEl();
  if (m && m.dataset.dirty) { toast('Unsaved changes. Click Cancel to close without saving.'); return; }
  closeModal();
});
window.addEventListener('beforeunload', e => { const m = modalEl(); if (m && m.dataset.dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  if (LISTS[S.page]) { document.getElementById('list').innerHTML = LISTS[S.page](); return; }
  const pos = e.target.selectionStart; refreshMain(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
});
document.addEventListener('change', e => {
  const t = e.target, m = /^([a-z])-acct$/.exec(t.className || ''), cell = m && t.closest('tr') && t.closest('tr').querySelector('td.charge');
  if (cell) { const keep = cell.querySelector('select'), kind = tagKind(t.value), was = keep && keep.className.endsWith('-tag') ? 'tag' : 'dept';
    if ((kind ? 'tag' : 'dept') !== was || kind) cell.outerHTML = chargeCell(cell.dataset.pfx, { dept: was === 'dept' && keep ? keep.value : '', tag: '' }, Number(cell.dataset.n), t.value); }
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  const relist = () => { document.getElementById('list').innerHTML = LISTS[S.page](); };
  if (t.id === 'vf') { S.vf = t.value; relist(); }
  else if (t.id === 'vm') { S.vm = t.value; relist(); }
  else if (t.id === 'bf') { S.bf = t.value; relist(); }
  else if (t.id === 'if') { S.if = t.value; relist(); }
  else if (t.id === 'kf') { S.kf = t.value; relist(); }
  else if (t.id === 'xf') { S.xf = t.value; S.q = ''; refreshMain(); }
  else if (t.id === 'sf') { S.sf = t.value; relist(); }
  else if (t.id === 'cf') { S.cf = t.value; refreshMain(); }
  else if (t.id === 'sm') { S.sm = t.value; refreshMain(); }
  else if (t.id === 'yr') switchYear(t.value);
  else if (t.id === 'cr') { S.cr = t.value; refreshMain(); }
  else if (t.id === 'tm') { S.tm = t.value; relist(); }
  else if (t.id === 'gm') { S.gm = t.value; relist(); }
  else if (t.id === 'bd') { S.bd = t.value; refreshMain(); }
});
window.addEventListener('afterprint', () => { document.body.classList.remove('pv'); document.getElementById('print-area').innerHTML = ''; });
/* Signed out after 3 hours without use, like the Inventory Hub. Apps Script ends the session at the same point. */
['click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (SESSION && Date.now() - (SESSION.last || 0) > 60000) touch(); }, true));
setInterval(() => { if (SESSION && Date.now() - (SESSION.last || 0) > IDLE_MS) signedOut('You were signed out after 3 hours without use.'); }, 60000);
/* Coming back to the tab picks up what others saved, unless a form is open. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S0.screen === 'app' && !document.querySelector('.overlay') && Date.now() - LOADED_AT > 120000) loadBooks(true);
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
probeLogo('light'); probeLogo('dark');
(function start() {
  if (!configured()) { S0.screen = 'noconfig'; render(); return; }
  SESSION = readSession();
  if (SESSION && Date.now() - (SESSION.last || 0) > IDLE_MS) { SESSION = null; saveSession(); S0.msg = 'You were signed out after 3 hours without use.'; }
  if (!SESSION) { S0.screen = 'login'; render(); return; }
  YEAR = Number(SESSION.year) || THIS_YEAR(); S.sm = YEAR === THIS_YEAR() ? todayIso().slice(0, 7) : `${YEAR}-12`;
  touch(); loadBooks();
})();

</script>
